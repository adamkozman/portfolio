<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">CareerConnect implementation overview</title><desc id="desc">Current React frontend: login form and profile editor with local state. Planned: backend integration, job discovery, applications, and status tracking.</desc><rect width="1440" height="1000" fill="#192d40"/><g font-family="Arial,sans-serif"><text x="85" y="108" font-size="24" letter-spacing="4" fill="#e0aa7a">CAREERCONNECT / TEAM PROJECT</text><text x="85" y="221" font-size="78" font-weight="700" fill="#fff8ef">A clearer path</text><text x="85" y="310" font-size="78" font-weight="700" fill="#fff8ef">to what’s next.</text><path d="M85 361H1355" stroke="#4b5c6c"/><text x="85" y="424" font-size="22" letter-spacing="3" fill="#e0aa7a">CURRENT FRONTEND</text><rect x="85" y="457" width="603" height="172" rx="6" fill="#fff8ef"/><rect x="712" y="457" width="643" height="172" rx="6" fill="#fff8ef"/><text x="119" y="521" font-size="36" fill="#192d40">Login interface</text><text x="119" y="579" font-size="25" fill="#526171">Client-side form validation</text><text x="748" y="521" font-size="36" fill="#192d40">Profile editor</text><text x="748" y="579" font-size="25" fill="#526171">Sample data · Local state</text><text x="85" y="717" font-size="22" letter-spacing="3" fill="#e0aa7a">PLANNED APPLICATION FLOW</text><g fill="#eef1f4" font-size="31"><text x="85" y="787">Discover jobs</text><text x="370" y="787">→</text><text x="450" y="787">Apply</text><text x="615" y="787">→</text><text x="695" y="787">Track progress</text></g><text x="85" y="861" font-size="25" fill="#b8c7d4">Backend and database integration are still to come.</text><text x="85" y="937" font-size="20" fill="#b8c7d4">Implementation diagram · In progress · Not a screenshot</text></g></svg>