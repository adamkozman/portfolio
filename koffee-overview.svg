<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc"><title id="title">Koffee Kozman feature overview</title><desc id="desc">A feature diagram showing a menu with coffee, other drinks, and bakery filters, sample prices, and a Montréal-time opening indicator.</desc><rect width="1440" height="1000" fill="#ebe2d3"/><g font-family="Arial,sans-serif" fill="#392b24"><text x="85" y="110" font-size="24" letter-spacing="4">KOFFEE KOZMAN / FRONTEND STUDY</text><text x="85" y="220" font-family="Georgia,serif" font-size="78">Small details.</text><text x="85" y="308" font-family="Georgia,serif" font-size="78">A better daily pause.</text><path d="M85 360H1355" stroke="#b9a48e"/><text x="85" y="419" font-size="22" letter-spacing="2">01  CATEGORY FILTERS</text><g font-size="28"><rect x="85" y="454" width="216" height="64" rx="5" fill="#4a382b"/><text x="132" y="496" fill="#fff9ee">All items</text><rect x="317" y="454" width="195" height="64" rx="5" fill="#f9f5ed"/><text x="369" y="496">Coffee</text><rect x="528" y="454" width="265" height="64" rx="5" fill="#f9f5ed"/><text x="565" y="496">Other drinks</text><rect x="809" y="454" width="195" height="64" rx="5" fill="#f9f5ed"/><text x="855" y="496">Bakery</text></g><text x="85" y="594" font-size="22" letter-spacing="2">02  14 SAMPLE ITEMS · PRICES IN CAD</text><g font-size="30"><rect x="85" y="626" width="610" height="100" fill="#f9f5ed"/><text x="117" y="688">Espresso</text><text x="564" y="688">$3.25</text><rect x="719" y="626" width="636" height="100" fill="#f9f5ed"/><text x="751" y="688">Kozman Latte</text><text x="1218" y="688">$5.50</text></g><text x="85" y="807" font-size="22" letter-spacing="2">03  LOCAL-TIME OPENING INDICATOR</text><text x="85" y="862" font-size="29">Opening hours follow Montréal time.</text><text x="85" y="937" font-size="20" fill="#756555">Feature diagram · Sample menu content · Not a screenshot</text></g></svg>